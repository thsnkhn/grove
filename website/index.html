<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Grove connects AI assistants to native macOS apps through the Model Context Protocol."
    />
    <meta name="theme-color" content="#fdfdfd" />
    <title>Grove — Native tools, close to home.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="hero-wrap">
        <section class="hero" aria-labelledby="page-title">
          <!-- TODO: Replace this reserved space with the Grove UI preview. -->
          <div class="preview-slot" aria-hidden="true"></div>

          <div class="copy">
            <p class="brand">
              <img class="brand-icon" src="tree-fill.svg" alt="" aria-hidden="true" />
              <span>Grove</span>
            </p>

            <div class="copy-lower">
              <h1 id="page-title">Native tools, close to home.</h1>
              <p class="description">
                A small local MCP server that gives AI assistants access to Calendar and Reminders on macOS.
              </p>

              <nav class="actions" aria-label="Project links">
                <a
                  class="button button-primary"
                  data-download-link
                  href="https://github.com/thsnkhn/grove/releases"
                >
                  <svg class="button-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 2.5v7" />
                    <path d="m5.25 7.25 2.75 2.75 2.75-2.75" />
                    <path d="M3 12.5h10" />
                  </svg>
                  Choose Mac download
                </a>
                <a class="button button-secondary" href="https://github.com/thsnkhn/grove">
                  <svg class="button-icon button-icon-star" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="m8 1.8 1.85 3.75 4.15.6-3 2.92.71 4.13L8 11.25l-3.71 1.95L5 9.07 2 6.15l4.15-.6L8 1.8Z" />
                  </svg>
                  Start on GitHub
                </a>
              </nav>
              <p class="support-note">macOS 14+ · Apple silicon or Intel-based Mac</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>
          © 2026 Grove ·
          <a href="https://x.com/thsnkhn" target="_blank" rel="noopener noreferrer">@thsnkhn</a>
        </span>
        <span>macOS 14+ · Swift 6</span>
      </footer>
    </div>
    <script src="download.js" defer></script>
  </body>
</html>
