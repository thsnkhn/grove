name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Grove version to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign, and notarize
        env:
          GROVE_VERSION: ${{ inputs.version }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: ./script/package_release.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Grove ${{ inputs.version }}
          files: |
            dist/Grove-${{ inputs.version }}.zip
            dist/SHA256SUMS
